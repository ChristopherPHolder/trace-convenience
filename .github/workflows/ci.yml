name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Vite+ (version from the pnpm catalog), Node.js (.node-version)
      # and pnpm (devEngines), then runs `vp install` with a cached store.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      # Same steps as `vp run ready`, split up for readable logs.
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
