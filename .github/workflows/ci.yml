name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Vite+ (version from pnpm-workspace.yaml catalog), Node, and
      # runs `vp install` with a cached pnpm store.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 26
          cache: true

      - run: vp check
      - run: vp test
      - run: vp run build
