packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": 26.6.5
  # @push-based/vite-plugin-ngp requires TypeScript >=6.0 <6.1.
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
